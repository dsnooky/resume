<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Cellphone Central</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Admin Panel</h1>

<h2>Add New Product</h2>
<form id="addProductForm">
  <input type="text" id="name" placeholder="Phone Name" required><br><br>
  <input type="text" id="price" placeholder="Price" required><br><br>
  <input type="text" id="image" placeholder="Image URL (or hosted link)" required><br><br>
  <input type="text" id="link" placeholder="Affiliate Link" required><br><br>
  <input type="checkbox" id="deal"> Highlight as Deal<br><br>
  <button type="submit">Add Product</button>
</form>

<h2>Existing Products</h2>
<div id="productList"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

<script>
// Initialize Firebase
const firebaseConfig = {
  apiKey: "AIzaSyASCkiW0xaR2MHudwRxZI5Ab6tpuHZIPhw",
  authDomain: "cellphonecentral-a94a5.firebaseapp.com",
  projectId: "cellphonecentral-a94a5",
  storageBucket: "cellphonecentral-a94a5.appspot.com",
  messagingSenderId: "6131202538",
  appId: "1:6131202538:web:5428a6f55b1c2fb01c9a93"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

// Add Product
document.getElementById('addProductForm').addEventListener('submit', async e => {
  e.preventDefault();

  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  const image = document.getElementById('image').value;
  const link = document.getElementById('link').value;
  const deal = document.getElementById('deal').checked;

  await db.collection("products").add({
    name,
    price,
    image, // URL of hosted image
    link,
    deal,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });

  e.target.reset();
  loadProducts();
});

// Load existing products
async function loadProducts() {
  const list = document.getElementById('productList');
  list.innerHTML = "";
  const snapshot = await db.collection("products").orderBy("timestamp", "desc").get();
  snapshot.forEach(doc => {
    const p = doc.data();
    const div = document.createElement('div');
    div.innerHTML = `
      <strong>${p.name}</strong> - ${p.price} ${p.deal ? "(Deal!)" : ""}
      <a href="${p.link}" target="_blank">Buy Link</a>`;
    list.appendChild(div);
  });
}

// Initial load
loadProducts();
</script>
</body>
</html>
