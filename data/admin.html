<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Cellphone Central</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Admin Panel - Add Product</h1>

<form id="addProductForm">
  <input type="text" id="name" placeholder="Phone Name" required><br><br>
  <input type="text" id="price" placeholder="Price" required><br><br>
  <input type="text" id="image" placeholder="Image URL" required><br><br>
  <input type="text" id="link" placeholder="Affiliate Link" required><br><br>
  <button type="submit">Add Product</button>
</form>

<h2>Existing Products</h2>
<div id="productList"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
// Initialize Firebase
const firebaseConfig = {
  apiKey: "AIzaSyASCkiW0xaR2MHudwRxZI5Ab6tpuHZIPhw",
  authDomain: "cellphonecentral-a94a5.firebaseapp.com",
  projectId: "cellphonecentral-a94a5",
  storageBucket: "cellphonecentral-a94a5.firebasestorage.app",
  messagingSenderId: "6131202538",
  appId: "1:6131202538:web:5428a6f55b1c2fb01c9a93"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Add Product
const form = document.getElementById('addProductForm');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  await db.collection("products").add({
    name: document.getElementById('name').value,
    price: document.getElementById('price').value,
    image: document.getElementById('image').value,
    link: document.getElementById('link').value,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
  form.reset();
  loadProducts();
});

// Load existing products
async function loadProducts() {
  const list = document.getElementById('productList');
  list.innerHTML = "";
  const snapshot = await db.collection("products").orderBy("timestamp", "desc").get();
  snapshot.forEach(doc => {
    const data = doc.data();
    const div = document.createElement('div');
    div.innerHTML = `<strong>${data.name}</strong> - ${data.price} <a href="${data.link}" target="_blank">Buy Link</a>`;
    list.appendChild(div);
  });
}

// Initial load
loadProducts();
</script>
</body>
</html>
