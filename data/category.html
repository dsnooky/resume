<div class="phone-grid" id="phoneGrid"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyASCkiW0xaR2MHudwRxZI5Ab6tpuHZIPhw",
  authDomain: "cellphonecentral-a94a5.firebaseapp.com",
  projectId: "cellphonecentral-a94a5",
  storageBucket: "cellphonecentral-a94a5.firebasestorage.app",
  messagingSenderId: "6131202538",
  appId: "1:6131202538:web:5428a6f55b1c2fb01c9a93"
});
const db = firebase.firestore();

const grid = document.getElementById('phoneGrid');
db.collection("products").orderBy("timestamp", "desc").onSnapshot(snapshot => {
  grid.innerHTML = "";
  snapshot.forEach(doc => {
    const p = doc.data();
    const card = document.createElement('div');
    card.classList.add('phone-card');
    card.innerHTML = `
      <img src="${p.image}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p>${p.price}</p>
      <a href="${p.link}" class="btn" target="_blank">Buy Now</a>
    `;
    grid.appendChild(card);
  });
});
</script>
