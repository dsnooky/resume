<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories - Cellphone Central</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
  <div class="logo">Cellphone Central</div>
</header>

<section class="category-list">
  <h2>Phones in this Category</h2>
  <div class="phone-grid" id="phoneGrid"></div>
</section>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
// Initialize Firebase
const firebaseConfig = {
  apiKey: "AIzaSyASCkiW0xaR2MHudwRxZI5Ab6tpuHZIPhw",
  authDomain: "cellphonecentral-a94a5.firebaseapp.com",
  projectId: "cellphonecentral-a94a5",
  storageBucket: "cellphonecentral-a94a5.firebasestorage.app",
  messagingSenderId: "6131202538",
  appId: "1:6131202538:web:5428a6f55b1c2fb01c9a93"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const grid = document.getElementById('phoneGrid');
db.collection("products").orderBy("timestamp", "desc").onSnapshot(snapshot => {
  grid.innerHTML = "";
  snapshot.forEach(doc => {
    const product = doc.data();
    const card = document.createElement('div');
    card.classList.add('phone-card');
    card.innerHTML = `
      <img src="${product.image}" alt="${product.name}">
      <h3>${product.name}</h3>
      <p>${product.price}</p>
      <a href="${product.link}" class="btn" target="_blank">Buy Now</a>
    `;
    grid.appendChild(card);
  });
});
</script>

</body>
</html>
